<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Sorteo Stand 2</title>
  <style>
    body { font-family: sans-serif; background: #e8f5e9; text-align: center; padding: 30px; }
    table { margin: auto; border-collapse: collapse; width: 90%; max-width: 800px; }
    th, td { border: 1px solid #ccc; padding: 10px; }
    th { background: #c8e6c9; }
    button { margin: 10px; padding: 10px 20px; background: #2e7d32; color: white; border: none; border-radius: 5px; }
    .alerta { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Sorteo - Stand 2</h1>
  <button onclick="mostrar()">Ver Participantes</button>
  <button onclick="sortear()">Sortear Ganador</button>
  <button onclick="descargar()">Descargar CSV</button>
  <button onclick="reiniciar()">Reiniciar</button>
  <div id="info"></div>
  <div id="ganador"></div>

  <script>
    let key = "participantes_stand2";

    function mostrar() {
      let datos = JSON.parse(localStorage.getItem(key)) || [];
      if (datos.length === 0) {
        document.getElementById("info").innerHTML = "<p>No hay participantes.</p>";
        return;
      }
      let dnis = new Set();
      let repetidos = new Set();
      let html = "<table><tr><th>Nombre</th><th>DNI</th><th>Teléfono</th></tr>";
      for (let p of datos) {
        if (dnis.has(p.dni)) repetidos.add(p.dni);
        dnis.add(p.dni);
        html += `<tr><td>${p.nombre}</td><td>${p.dni}</td><td>${p.telefono}</td></tr>`;
      }
      html += "</table>";
      if (repetidos.size > 0) {
        html += `<p class='alerta'>DNI repetidos: ${Array.from(repetidos).join(", ")}</p>`;
      }
      document.getElementById("info").innerHTML = html;
    }

    function sortear() {
      let datos = JSON.parse(localStorage.getItem(key)) || [];
      if (datos.length === 0) return alert("No hay participantes.");
      let p = datos[Math.floor(Math.random() * datos.length)];
      document.getElementById("ganador").innerHTML = `<h2>Ganador: ${p.nombre}</h2><p>DNI: ${p.dni} | Tel: ${p.telefono}</p>`;
    }

    function descargar() {
      let datos = JSON.parse(localStorage.getItem(key)) || [];
      if (datos.length === 0) {
        alert("No hay participantes.");
        return;
      }
      let csv = "Nombre,DNI,Teléfono\n";
      for (let p of datos) {
        csv += `${p.nombre},${p.dni},${p.telefono}\n`;
      }
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "participantes.csv";
      a.click();
    }

    function reiniciar() {
      if (confirm("¿Seguro que querés borrar todos los participantes?")) {
        localStorage.removeItem(key);
        location.reload();
      }
    }
  </script>
</body>
</html>
